<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" /> <!-- Устанавливаем иконку веб-сайта -->
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Устанавливаем настройки видимости для мобильных устройств -->
    <meta name="theme-color" content="#000000" /> <!-- Устанавливаем цвет темы -->
    <meta
      name="description"
      content="Веб-сайт, созданный с использованием create-react-app"
    /> <!-- Описание веб-сайта -->
    <link rel="apple-touch-icon" href="logo192.png" /> <!-- Устанавливаем иконку для мобильных устройств -->
    <!--
      manifest.json содержит метаданные, используемые при установке вашего веб-приложения на
      мобильное устройство или настольный компьютер пользователя. См. https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> <!-- Ссылка на файл манифеста -->
    <!--
      Обратите внимание на использование %PUBLIC_URL% в вышеуказанных тегах.
      Он будет заменен на URL папки `public` во время сборки.
      Только файлы в папке `public` могут быть ссылками из HTML.
      В отличие от "/favicon.ico" или "favicon.ico", "%PUBLIC_URL%/favicon.ico" будет
      правильно работать как с маршрутизацией на стороне клиента, так и с нерутовым общедоступным URL.
      Узнайте, как настроить нерутовый общедоступный URL, запустив `npm run build`.
    -->
    <title>Lock Guard</title> <!-- Заголовок страницы -->
  </head>
  <body>
    <noscript>Включите JavaScript, чтобы запустить это приложение.</noscript> <!-- Предупреждение для пользователей, если JavaScript отключен -->
    <div id="root"></div> <!-- Корневой элемент для рендеринга React-приложения -->
  </body>
</html>
